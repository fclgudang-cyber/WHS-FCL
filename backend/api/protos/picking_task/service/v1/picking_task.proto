syntax = "proto3";

package picking_task.service.v1;

import "gnostic/openapi/v3/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "google/api/field_behavior.proto";

// 拣货任务服务：波次 lepaskan 后生成任务；移动端扫码作业（keranjang → lokasi → SKU → qty）。
// 状态机：WAITING → RUNNING → DONE；WAITING 可 CANCELLED。
service PickingTaskService {
  // 列表
  rpc List (pagination.PagingRequest) returns (ListPickingTaskResponse) {}

  // 详情（含明细）
  rpc Get (GetPickingTaskRequest) returns (PickingTask) {}

  // 扫码 Keranjang：任务绑定 keranjang，WAITING → RUNNING。
  rpc ScanCart (ScanCartRequest) returns (google.protobuf.Empty) {}

  // 扫码 lokasi：校验 lokasi 是任务涉及的理货 lokasi（→ item PICKING）。
  // 可选：连续扫两次 lokasi（主/次）。MVP：单 lokasi。
  rpc ScanLocation (ScanLocationRequest) returns (google.protobuf.Empty) {}

  // 扫码 SKU：校验 lokasi 下的 SKU 与任务明细一致（→ item PICKING）。
  rpc ScanSku (ScanSkuRequest) returns (google.protobuf.Empty) {}

  // 输入拣货数量：默认按 qty_required - qty_picked 自动填冲，支持 short pick（< 剩余：填 reason）。
  rpc ScanQty (ScanQtyRequest) returns (google.protobuf.Empty) {}

  // 提交整个明细为完成（批量勾选用）。
  rpc CompleteItem (CompleteItemRequest) returns (google.protobuf.Empty) {}

  // 创建任务（内部：lepaskan 波次时调用；也支持手动）。
  rpc Create (CreatePickingTaskRequest) returns (google.protobuf.Empty) {}

  // 取消任务（仅 WAITING）
  rpc Cancel (CancelPickingTaskRequest) returns (google.protobuf.Empty) {}

  // Keranjang 列表
  rpc ListCarts (ListCartsRequest) returns (ListPickingCartResponse) {}

  // Keranjang 创建
  rpc CreateCart (CreateCartRequest) returns (google.protobuf.Empty) {}

  // Keranjang 释放（IN_USE → FREE）
  rpc ReleaseCart (CancelPickingCartRequest) returns (google.protobuf.Empty) {}
}

message ListCartsRequest {}
message CreateCartRequest { string cart_number = 1 [json_name = "cartNumber"]; }

enum PickingTaskStatus {
  PICKING_TASK_WAITING = 0;
  PICKING_TASK_RUNNING = 1;
  PICKING_TASK_DONE = 2;
  PICKING_TASK_CANCELLED = 3;
}

enum PickingTaskItemStatus {
  PICKING_TASK_ITEM_PENDING = 0;
  PICKING_TASK_ITEM_PICKING = 1;
  PICKING_TASK_ITEM_DONE = 2;
  PICKING_TASK_ITEM_SHORT = 3;
}

message PickingTask {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "任务ID"}
  ]; // 任务ID

  optional string task_number = 2 [
    json_name = "taskNumber",
    (gnostic.openapi.v3.property) = {description: "任务号，租户范围内唯一，服务端生成"}
  ]; // 任务号

  optional uint32 wave_id = 3 [
    json_name = "waveId",
    (gnostic.openapi.v3.property) = {description: "来源波次ID"}
  ]; // 来源波次ID

  optional uint32 cart_id = 4 [
    json_name = "cartId",
    (gnostic.openapi.v3.property) = {description: "绑定 keranjang ID"}
  ]; // 绑定 Keranjang ID

  optional PickingTaskStatus status = 5 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "任务状态"}
  ]; // 任务状态

  optional string cart_number = 6 [
    json_name = "cartNumber",
    (gnostic.openapi.v3.property) = {description: "Keranjang 编号"}
  ]; // Keranjang 编号

  repeated PickingTaskItem items = 7 [
    json_name = "items",
    (gnostic.openapi.v3.property) = {description: "任务明细"}
  ]; // 任务明细

  optional google.protobuf.Timestamp created_at = 102 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 103 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

message PickingTaskItem {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "明细ID"}
  ]; // 明细ID

  optional uint32 task_id = 2 [
    json_name = "taskId",
    (gnostic.openapi.v3.property) = {description: "所属任务ID"}
  ]; // 所属任务ID

  optional string sku_code = 3 [
    json_name = "skuCode",
    (gnostic.openapi.v3.property) = {description: "SKU 编码"}
  ]; // SKU 编码

  optional string product_name = 4 [
    json_name = "productName",
    (gnostic.openapi.v3.property) = {description: "商品名称"}
  ]; // 商品名称

  optional int64 qty_required = 5 [
    json_name = "qtyRequired",
    (gnostic.openapi.v3.property) = {description: "需要数量"}
  ]; // 需要数量

  optional int64 qty_picked = 6 [
    json_name = "qtyPicked",
    (gnostic.openapi.v3.property) = {description: "已拣数量"}
  ]; // 已拣数量

  optional string allocated_location_code = 7 [
    json_name = "allocatedLocationCode",
    (gnostic.openapi.v3.property) = {description: "分配 lokasi 编码"}
  ]; // 分配 lokasi 编码

  optional string allocated_location_id = 8 [
    json_name = "allocatedLocationId",
    (gnostic.openapi.v3.property) = {description: "分配 lokasi ID"}
  ]; // 分配 lokasi ID

  optional PickingTaskItemStatus status = 9 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "明细状态"}
  ]; // 明细状态

  optional string short_reason = 10 [
    json_name = "shortReason",
    (gnostic.openapi.v3.property) = {description: "short pick 原因"}
  ]; // short pick 原因
}

message ListPickingTaskResponse {
  uint64 total = 1 [json_name = "total"];
  repeated PickingTask items = 2 [json_name = "items"];
}

message GetPickingTaskRequest {
  uint32 id = 1 [json_name = "id"];
}

message ScanCartRequest {
  uint32 task_id = 1 [json_name = "taskId"];
  string cart_number = 2 [json_name = "cartNumber"]; // 扫码 Keranjang 编号
}

message ScanLocationRequest {
  uint32 task_id = 1 [json_name = "taskId"];
  string location_code = 2 [json_name = "locationCode"]; // 扫码 lokasi 编码
}

message ScanSkuRequest {
  uint32 task_id = 1 [json_name = "taskId"];
  string sku_code = 2 [json_name = "skuCode"]; // 扫码 SKU 编码
}

message ScanQtyRequest {
  uint32 task_id = 1 [json_name = "taskId"];
  uint32 item_id = 2 [json_name = "itemId"];
  int64 qty = 3 [json_name = "qty"]; // 本次拣货数量（含快捷填满）
  string short_reason = 4 [json_name = "shortReason", (gnostic.openapi.v3.property) = {description: "short pick 原因（qty 小于剩余量时必填）"}]; // short pick 原因
}

message CompleteItemRequest {
  uint32 task_id = 1 [json_name = "taskId"];
  uint32 item_id = 2 [json_name = "itemId"];
  bool short = 3 [json_name = "short"]; // true = short pick；需要 short_reason
  string short_reason = 4 [json_name = "shortReason"];
}

message CreatePickingTaskRequest {
  uint32 wave_id = 1 [json_name = "waveId"];
  uint32 cart_id = 2 [json_name = "cartId"]; // 可选；为 0 时只能分配后才能 start（或现场 scan cart）
}

message CancelPickingTaskRequest {
  uint32 id = 1 [json_name = "id"];
}


// Keranjang 列表
message PickingCart {
  optional uint32 id = 1 [json_name = "id"];
  optional string cart_number = 2 [json_name = "cartNumber"];
  optional string status = 3 [json_name = "status",(gnostic.openapi.v3.property) = {description: "FREE / IN_USE / DISABLED"}];
  optional uint32 tenant_id = 20 [json_name = "tenantId"];
  optional google.protobuf.Timestamp created_at = 102 [json_name = "createdAt"];
}

message ListPickingCartResponse {
  uint64 total = 1 [json_name = "total"];
  repeated PickingCart items = 2 [json_name = "items"];
}

message CancelPickingCartRequest {
  uint32 id = 1 [json_name = "id"];
}
