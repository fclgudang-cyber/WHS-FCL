syntax = "proto3";

package admin.service.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

import "pagination/v1/pagination.proto";
import "order/service/v1/order.proto";

// 订单管理服务（管理后台）
service OrderService {
  // 查询订单列表
  rpc List (pagination.PagingRequest) returns (order.service.v1.ListOrderResponse) {
    option (google.api.http) = {
      get: "/admin/v1/orders"
    };
  }

  // 统计订单数量
  rpc Count (pagination.PagingRequest) returns (order.service.v1.CountOrderResponse) {
    option (google.api.http) = {
      get: "/admin/v1/orders/count"
    };
  }

  // 查询订单详情（含明细）
  rpc Get (order.service.v1.GetOrderRequest) returns (order.service.v1.Order) {
    option (google.api.http) = {
      get: "/admin/v1/orders/{id}"
    };
  }

  // 创建订单（手动补录）
  rpc Create (order.service.v1.CreateOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/orders"
      body: "*"
    };
  }

  // 更新订单（仅 PENDING 可改）
  rpc Update (order.service.v1.UpdateOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/orders/{id}"
      body: "*"
    };
  }

  // 删除订单（仅 PENDING / CANCELLED）
  rpc Delete (order.service.v1.DeleteOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/orders/{id}"
    };
  }

  // 确认订单
  rpc Confirm (order.service.v1.ConfirmOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/orders/{id}/confirm"
      body: "*"
    };
  }

  // 取消订单
  rpc Cancel (order.service.v1.CancelOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/orders/{id}/cancel"
      body: "*"
    };
  }

  // 履约：生成出库拣货单
  rpc Fulfill (order.service.v1.FulfillOrderRequest) returns (order.service.v1.FulfillOrderResponse) {
    option (google.api.http) = {
      post: "/admin/v1/orders/{id}/fulfill"
      body: "*"
    };
  }

  // 标记完结
  rpc Complete (order.service.v1.CompleteOrderRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/orders/{id}/complete"
      body: "*"
    };
  }

  // Marketplace 同步（示例实现，管理端触发）：按租户幂等 upsert 外部订单
  rpc ImportMarketplace (order.service.v1.ImportMarketplaceRequest) returns (order.service.v1.ImportMarketplaceResponse) {
    option (google.api.http) = {
      post: "/admin/v1/orders/import"
      body: "*"
    };
  }

  // Marketplace Webhook（外部平台推送，header X-Marketplace-Token 校验）：
  // POST /admin/v1/orders/webhook  body: {"source":"ORDER_SOURCE_SHOPEE","orders":[...]}
  rpc Webhook (order.service.v1.ImportMarketplaceRequest) returns (order.service.v1.ImportMarketplaceResponse) {
    option (google.api.http) = {
      post: "/admin/v1/orders/webhook"
      body: "*"
    };
  }
}
