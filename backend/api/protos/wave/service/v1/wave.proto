syntax = "proto3";

package wave.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// 波次服务：订单分析页的 SKU 进入波次，波次执行（cek stok/allocate/release），
// 以及拣货任务（任务创建 → 扫码作业 → 完结）。
//
// 状态机：
//   DRAFT → CHECKED → READY_TO_RELEASE → RELEASED → COMPLETED
//   DRAFT/CHECKED/READY_TO_RELEASE 可 CANCELLED。
//   CHECKED：已跑 cek stok（部分不可用或未跑）
//   READY_TO_RELEASE： semua SKU tersedia & reserved
//   RELEASED： 任务已生成，波次 SKU 已锁定
service WaveService {
  // 查询波次列表
  rpc List (pagination.PagingRequest) returns (ListWaveResponse) {}

  // 统计波次数量
  rpc Count (pagination.PagingRequest) returns (CountWaveResponse) {}

  // 查询波次详情（含 SKU 行与 cek stok 结果）
  rpc Get (GetWaveRequest) returns (Wave) {}

  // 创建波次（从 picking_ids 或指定 wave_items）
  rpc Create (CreateWaveRequest) returns (google.protobuf.Empty) {}

  // 将订单中的 SKU 添加进当前活跃波次（自动创建波次）
  rpc AddSkus (AddSkusRequest) returns (AddSkusResponse) {}

  // cek stok 每个 SKU：可用量、lokasi、reservasi；更新状态 & reserve
  rpc Check (CheckWaveRequest) returns (CheckWaveResponse) {}

  // lepaskan 波次：状态 → RELEASED，生成拣货任务
  rpc Release (ReleaseWaveRequest) returns (ReleaseWaveResponse) {}

  // 取消波次（释放 reservasi）
  rpc Cancel (CancelWaveRequest) returns (google.protobuf.Empty) {}
}

// 波次状态
enum WaveStatus {
  WAVE_DRAFT = 0;         // 草稿
  WAVE_RUNNING = 1;       // 执行中（兼容旧版；新流程不再用）
  WAVE_COMPLETED = 2;     // 已完成（终态：任务全部完成）
  WAVE_CANCELLED = 3;     // 已取消（终态）
  WAVE_CHECKED = 4;       // 已 cek stok
  WAVE_READY_TO_RELEASE = 5;  // siap dilepas（全部 SKU tersedia）
  WAVE_RELEASED = 6;      // dilepas（任务已生成）
}

// 波次
message Wave {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "波次ID"}
  ]; // 波次ID

  optional string wave_number = 2 [
    json_name = "waveNumber",
    (gnostic.openapi.v3.property) = {description: "波次号，租户范围内唯一，服务端生成"}
  ]; // 波次号

  optional WaveStatus status = 3 [
    json_name = "status",
    (gnostic.openapi.v3.property) = {description: "波次状态"}
  ]; // 波次状态

  // SKU 行（cek stok 时填充 availability；release 后驱动任务）
  repeated WaveItem items = 4 [
    json_name = "items",
    (gnostic.openapi.v3.property) = {description: "SKU 行"}
  ]; // SKU 行

  optional string remark = 8 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注

  optional uint32 cart_id = 9 [
    json_name = "cartId",
    (gnostic.openapi.v3.property) = {description: "分配的 keranjang ID"}
  ]; // 分配的 keranjang ID

  optional uint32 tenant_id = 20 [
    json_name = "tenantId",
    (gnostic.openapi.v3.property) = {description: "租户ID，0代表系统全局"}
  ]; // 租户ID，0代表系统全局

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者用户ID"}]; // 创建者用户ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者用户ID"}]; // 更新者用户ID
  optional google.protobuf.Timestamp created_at = 102 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}]; // 创建时间
  optional google.protobuf.Timestamp updated_at = 103 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}]; // 更新时间
}

// 波次 SKU 行
message WaveItem {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = {description: "行ID"}
  ]; // 行ID

  optional uint32 wave_id = 2 [
    json_name = "waveId",
    (gnostic.openapi.v3.property) = {description: "所属波次ID"}
  ]; // 所属波次ID

  optional string sku_code = 3 [
    json_name = "skuCode",
    (gnostic.openapi.v3.property) = {description: "SKU 编码"}
  ]; // SKU 编码

  optional string product_name = 4 [
    json_name = "productName",
    (gnostic.openapi.v3.property) = {description: "商品名称"}
  ]; // 商品名称

  optional int64 qty_required = 5 [
    json_name = "qtyRequired",
    (gnostic.openapi.v3.property) = {description: "需要数量"}
  ]; // 需要数量

  optional int64 qty_allocated = 6 [
    json_name = "qtyAllocated",
    (gnostic.openapi.v3.property) = {description: "已分配数量"}
  ]; // 已分配数量

  // cek stok 结果：AVAILABLE / PARTIAL / UNAVAILABLE / NOT_FOUND
  optional string availability = 7 [
    json_name = "availability",
    (gnostic.openapi.v3.property) = {description: "cek stok 结果"}
  ]; // cek stok 结果

  optional string allocated_from = 8 [
    json_name = "allocatedFrom",
    (gnostic.openapi.v3.property) = {description: "分配 lokasi（可用量来源描述）"}
  ]; // 分配 lokasi

  optional string allocated_location_id = 9 [
    json_name = "allocatedLocationId",
    (gnostic.openapi.v3.property) = {description: "分配 lokasi ID"}
  ]; // 分配 lokasi ID

  optional string remark = 10 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注
}

message GetWaveRequest {
  oneof query_by {
    uint32 id = 1 [json_name = "id"];
  }
}

message CreateWaveRequest {
  // 成员拣货单（兼容旧版）或直接 SKU（本流程使用）
  repeated uint32 picking_ids = 1 [json_name = "pickingIds"];

  repeated WaveItem items = 2 [json_name = "items"];

  optional string remark = 3 [
    json_name = "remark",
    (gnostic.openapi.v3.property) = {description: "备注"}
  ]; // 备注
}

// 将订单里的 SKU 加进波次
message AddSkusRequest {
  repeated AddSkusItem items = 1 [json_name = "items"];

  optional uint32 wave_id = 2 [
    json_name = "waveId",
    (gnostic.openapi.v3.property) = {description: "目标波次；为 0 时自动取/建租户当前草稿波次"}
  ]; // 目标波次
}

message AddSkusItem {
  string sku_code = 1 [json_name = "skuCode"]; // SKU 编码
  string product_name = 2 [json_name = "productName"]; // 商品名称
  int64 qty = 3 [json_name = "qty"]; // 数量
  optional uint32 order_id = 4 [json_name = "orderId"]; // 来源订单ID（分拣分配用）
}

message AddSkusResponse {
  uint32 wave_id = 1 [json_name = "waveId"]; // 波次ID
  bool created = 2 [json_name = "created"]; // 是否新建波次
}

message CheckWaveRequest {
  uint32 id = 1 [json_name = "id"]; // 波次ID
}

message CheckWaveResponse {
  uint32 id = 1 [json_name = "id"]; // 波次ID
  WaveStatus status = 2 [json_name = "status"]; // 更新后状态
  bool ready_to_release = 3 [json_name = "readyToRelease"]; // 是否全部 tersedia
  repeated WaveItem items = 4 [json_name = "items"]; // cek stok 明细
  string message = 5 [json_name = "message"]; // 人读说明
}

message ReleaseWaveRequest {
  uint32 id = 1 [json_name = "id"]; // 波次ID
}

message ReleaseWaveResponse {
  uint32 id = 1 [json_name = "id"]; // 波次ID
  WaveStatus status = 2 [json_name = "status"]; // 更新后状态（RELEASED）
  uint32 picking_task_id = 3 [json_name = "pickingTaskId"]; // 生成的拣货任务ID
}

message CancelWaveRequest {
  uint32 id = 1 [json_name = "id"]; // 波次ID
}

message ListWaveResponse {
  uint64 total = 1 [json_name = "total"]; // 总数

  repeated Wave items = 2 [json_name = "items"]; // 波次列表
}

message CountWaveResponse {
  uint64 count = 1 [json_name = "count"]; // 数量
}
