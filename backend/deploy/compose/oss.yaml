# 容器网络专用的对象存储配置（在镜像启动时由 entrypoint.sh 渲染占位符）。
# 公网部署时把 MINIO_UPLOAD_HOST / MINIO_DOWNLOAD_HOST 设成浏览器与 App 实际可达的地址，
# 例如 https://minio.你的域名；不设则保持旧的 127.0.0.1 默认值。
oss:
  minio:
    endpoint: "${MINIO_ENDPOINT:minio:9000}"
    upload_host: "${MINIO_UPLOAD_HOST:127.0.0.1:9000}"
    download_host: "${MINIO_DOWNLOAD_HOST:http://127.0.0.1:9000}"
    access_key: "${MINIO_ACCESS_KEY:root}"
    secret_key: "${MINIO_SECRET_KEY:*Abcd123456}"
    token: ""
    use_ssl: false
