
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip on;
  # gzip_buffers 32 16k;
  # gzip_comp_level 6;
  # gzip_min_length 1k;
  # gzip_static on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  server {
    listen 8080;
    server_name localhost;

    # GhostWMS Admin API → admin-service (Go, port 6900)
    location /admin/ {
      proxy_pass http://admin-service:6900;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 50m;
      proxy_read_timeout 120s;
    }

    # SSE (notifikasi) → admin-service sse server (port 6901, path /events)
    location /events {
      proxy_pass http://admin-service:6901/events;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    # Short URL untuk webhook fingerprint Solution X900 (ADMS)
    location = /fp {
      proxy_pass http://fcl-service:6905/api/fingerprint-webhook;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Content-Type $content_type;
      client_max_body_size 50m;
      proxy_read_timeout 120s;
    }

    # FCL API → fcl-service (Go, port 6905)
    location /api/ {
      proxy_pass http://fcl-service:6905;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 50m;
      proxy_read_timeout 120s;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      expires 365d;
      access_log off;
      add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
